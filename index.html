<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grupo 14 — PRIDE</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f3ef;
      --panel:#efece4;
      --accent:#f6b6c7;
      --muted:#dcd7cf;
      --yellow:#f6d269;
      --orange:#ff6f4d;
      --nav-border:#222;
      --card-bg:#ffffff;
      --text:#222;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Open Sans",system-ui,Segoe UI,Roboto,Arial;
      background:#fff;
      color:var(--text);
    }
    .wrapper{
      max-width:1100px;
      margin:36px auto;
      padding:20px;
    }

    /* header / logo */
    header{
      text-align:center;
      margin-bottom:10px;
    }
    .logo{
      display:inline-block;
      background:linear-gradient(90deg,#fbf7f0,#f7f3ee);
      padding:18px 34px;
      border-radius:6px;
      box-shadow:0 0 0 6px rgba(0,0,0,0.02) inset;
      font-family:"Montserrat",sans-serif;
      letter-spacing:4px;
      font-size:34px;
      color:#444;
    }
    .logo .brand{
      display:inline-block;
      background:linear-gradient(90deg,#fff2d9,#fffafa);
      padding:6px 10px;
      border-radius:4px;
      margin-right:10px;
      color:#e55;
      font-weight:700;
    }
    .logo .heart{
      color:#7b4bc2;
      margin-left:6px;
      font-size:20px;
    }

    /* nav */
    nav{
      margin-top:18px;
      border-top:2px solid var(--nav-border);
      display:flex;
      justify-content:center;
      gap:30px;
      font-weight:600;
      padding-top:12px;
    }
    nav a{
      text-decoration:none;
      color:#222;
      padding:8px 14px;
      font-size:14px;
    }
    nav a.active{
      background:var(--accent);
      color:white;
      border-radius:4px;
      padding:10px 18px;
    }

    /* main layout */
    .main{
      display:grid;
      grid-template-columns: 1fr 300px;
      gap:20px;
      margin-top:20px;
    }

    /* left panel (content cards) */
    .content{
      background:var(--panel);
      padding:22px;
      border-radius:12px;
      min-height:540px;
      position:relative;
    }
    .row{
      display:flex;
      gap:20px;
      align-items:flex-start;
      margin-bottom:20px;
    }
    .card{
      background:var(--card-bg);
      padding:14px;
      border-radius:6px;
      box-shadow:0 0 0 2px rgba(0,0,0,0.02) inset;
      flex:1;
      min-height:90px;
    }
    .card h3{
      margin:0 0 8px 0;
      color:var(--orange);
      font-size:16px;
      font-weight:700;
    }
    .card small{display:block;color:#777;font-size:12px;margin-bottom:6px}

    /* framed image styles to mimic the picture borders */
    .frame{
      width:180px;
      flex:0 0 180px;
      height:110px;
      background:#fff;
      border:8px solid #eaa;
      border-image: linear-gradient(90deg,#f7c6c6,#ffeded) 1;
      border-radius:6px;
      overflow:hidden;
    }
    .frame img{width:100%;height:100%;object-fit:cover;display:block}

    .scallop{
      width:120px;
      height:120px;
      background:#ffc;
      padding:8px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 0 0 12px #ffd86f inset;
      flex:0 0 140px;
    }
    .scallop img{width:100%;height:auto;border-radius:6px;display:block}

    /* right sidebar */
    aside{
      background:var(--yellow);
      padding:18px;
      border-radius:6px;
      min-height:540px;
    }
    .aside-box{
      background:#fff;
      padding:12px;
      margin-top:12px;
      border-radius:4px;
    }
    .blue-sq{
      background:#4a7bd9;
      height:160px;
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:40px;
    }

    /* responsive */
    @media (max-width:960px){
      .main{grid-template-columns:1fr; }
      aside{order:2}
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">
        <span class="brand">PRIDE</span>
        <span class="heart">♥</span>
      </div>
      <nav>
        <a href="#">HISTÒRIA</a>
        <a href="#">ACTUALITAT</a>
        <a class="active" href="#">REFERENTS</a>
        <a href="#">SOBRE NOSALTRES</a>
      </nav>
    </header>

    <main class="main">
      <section class="content">
        <div class="row">
          <div class="card">
            <h3>Lady Gaga</h3>
            <small>neixament<br>Informació</small>
            <div style="height:80px"></div>
          </div>
          <div class="frame" aria-hidden="true">
            <img src="https://picsum.photos/seed/gaga/400/300" alt="Lady Gaga">
          </div>
        </div>

        <div class="row">
          <div class="scallop">
            <img src="https://picsum.photos/seed/freddy/300/300" alt="Freddy Mercuri">
          </div>
          <div class="card">
            <h3>Freddy Mercuri</h3>
            <small>neixament<br>Informació</small>
            <div style="height:60px"></div>
          </div>
        </div>

        <div class="row">
          <div class="card" style="min-height:120px">
            <h3>Nom</h3>
            <small>neixament<br>Informació</small>
          </div>
          <div class="card" style="background:linear-gradient(180deg,#ffdfe6,#fff)">
            <img src="https://picsum.photos/seed/flowers/260/120" alt="Decor" style="width:100%;border-radius:6px;display:block">
          </div>
        </div>
      </section>

      <aside>
        <div class="blue-sq">
          <span style="font-size:28px">📣</span>
        </div>
        <div class="aside-box">
          <h4 style="margin:0 0 6px 0">Referent de l'any</h4>
          <small>neixament<br>Informació</small>
        </div>
      </aside>
    </main>
  </div>
</body>
</html>
